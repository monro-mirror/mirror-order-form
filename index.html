<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа зеркала</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Форма заказа зеркала</h2>
        <form id="orderForm" class="space-y-4">
            <div>
                <label for="mirrorSize" class="block text-sm font-medium text-gray-700">Размер зеркала</label>
                <input type="text" id="mirrorSize" name="mirrorSize" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Например, 60x80 см" required>
            </div>
            <div>
                <label for="color" class="block text-sm font-medium text-gray-700">Цвет</label>
                <select id="color" name="color" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                    <option value="" disabled selected>Выберите цвет</option>
                    <option value="Серебро">Серебро</option>
                    <option value="Золото">Золото</option>
                    <option value="Черный">Черный</option>
                    <option value="Белый">Белый</option>
                </select>
            </div>
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Адрес доставки</label>
                <input type="text" id="address" name="address" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Город, улица, дом" required>
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">Номер телефона</label>
                <input type="tel" id="phone" name="phone" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="+7 (XXX) XXX-XX-XX" required>
            </div>
            <button type="button" id="whatsappButton" class="w-full bg-green-500 text-white p-3 rounded-md hover:bg-green-600 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.520-.074-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.099-.198-.198-.297-.347z"/>
                    <path d="M12 2C6.48 2 2 6.48 2 12c0 1.776.463 3.447 1.268 4.9L2 22l5.1-1.268C8.553 21.537 10.224 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.776 0-3.447-.463-4.9-1.268l-.351-.088-3.022.752.752-3.022-.088-.351C3.463 15.447 3 13.776 3 12c0-4.963 4.037-9 9-9s9 4.037 9 9-4.037 9-9 9z"/>
                </svg>
                Отправить в WhatsApp
            </button>
        </form>
    </div>

<script>
    function sendToWhatsApp() {
        const mirrorSize = document.getElementById('mirrorSize').value;
        const color = document.getElementById('color').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;

        if (!mirrorSize || !color || !address || !phone) {
            alert('Пожалуйста, заполните все поля формы.');
            return;
        }

        const message = 'Новый заказ зеркала:\nРазмер: ${mirrorSize}\nЦвет: ${color}\nАдрес доставки: ${address}\nНомер телефона: ${phone}';
        const whatsappNumber = '+79221939224';
        const whatsappUrl = 'https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}';
        window.location.href = whatsappUrl;
    }

    // Привязываем событие после загрузки DOM
    document.getElementById('whatsappButton').addEventListener('click', sendToWhatsApp);
</script>
</body>
</html>
